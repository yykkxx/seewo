name: Release

# ==========================================================================
#  正式发布工作流
#  - 仅支持手动触发 (workflow_dispatch)
#  - 输入版本号后执行与预发布相同的打包流程
#  - 产出: Windows 平台两个 exe (PyInstaller 版 + Nuitka 版)
#          直接作为 Release 资产上传, 创建 latest 正式 Release
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (SemVer, 例如 1.2.0; 可带 v 前缀)'
        required: true
        type: string
      notes:
        description: '发布说明 (留空则自动生成)'
        required: false
        default: ''
        type: string

# 创建 Release 需要写权限
permissions:
  contents: write

# 正式发布不允许被中途取消, 因此只排队不打断;
# 同版本号重复触发时后到的任务会被自动取消, 避免重复打标签。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------- 版本号校验
  verify:
    name: 校验版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 规范化并校验版本号
        id: check
        env:
          RAW_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 去掉可选的 v 前缀与首尾空白
          VERSION="$(echo "${RAW_VERSION}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^[vV]//')"
          TAG="v${VERSION}"

          if [ -z "${VERSION}" ]; then
            echo "::error::版本号不能为空"
            exit 1
          fi

          # 要求形如 1.2.0 或 1.2.0-rc.1
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 '${VERSION}' 不符合 SemVer 规范"
            echo "::error::正确示例: 1.0.0 / 1.2.0 / 2.0.0-rc.1"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "::error::标签 ${TAG} 已存在, 请更换版本号"
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} 已存在, 请更换版本号"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "正式发布版本号: ${TAG}"

  # ---------------------------------------------------------------- 构建
  build:
    name: 构建 (${{ matrix.tool }})
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [pyinstaller, nuitka]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller" "nuitka" "zstandard"

      - name: 打包 (${{ matrix.tool }}, 单文件)
        shell: bash
        run: |
          set -euo pipefail
          python build.py --tool "${{ matrix.tool }}" --onefile

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.tool }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------- 发布
  release:
    name: 创建正式发布
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成发布说明
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          ls -lh artifacts/*/
          if [ -n "${INPUT_NOTES}" ]; then
            printf '%s\n' "${INPUT_NOTES}" > notes.md
          else
            {
              echo "## SeewoGuard ${TAG}"
              echo
              echo "| 项目 | 值 |"
              echo "| --- | --- |"
              echo "| 版本号 | \`${VERSION}\` |"
              echo "| 提交 | \`${GITHUB_SHA}\` |"
              echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
              echo "| 发布时间 | $(date -u +'%Y-%m-%d %H:%M:%S') UTC |"
              echo
              echo "### 产物说明"
              echo
              echo "- \`seewokiller_pyinstaller.exe\` - PyInstaller 打包版"
              echo "- \`seewokiller_nuitka.exe\` - Nuitka 编译打包版"
              echo
              echo "### 使用提示"
              echo
              echo "1. 两个 exe 功能相同, 任选其一; 无需解压, 下载后直接运行。"
              echo "2. 请右键以管理员身份运行。"
              echo "3. 本项目仅支持 Windows。"
            } > notes.md
          fi
          cat notes.md

      - name: 创建 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 只下载产物不 checkout 代码, gh 需要 GH_REPO 才能定位仓库
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # exe 直接作为发布资产, 不打压缩包
          gh release create "$TAG" \
            --title "SeewoGuard $VERSION" \
            --notes-file notes.md \
            --latest \
            --target "$GITHUB_SHA" \
            artifacts/*/*.exe
          echo "已发布正式版本: $TAG"
