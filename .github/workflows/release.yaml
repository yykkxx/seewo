name: Official Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '打包方式'
        required: true
        default: 'pyinstaller'
        type: choice
        options:
          - pyinstaller
          - nuitka
          - both
      tag:
        description: 'Release 标签；留空则自动用 v<VERSION>'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller nuitka
        pip install -r requirements.txt
        pip show pywin32 >nul && python -m pywin32_postinstall -install || echo skip pywin32

    - name: Get version
      id: ver
      shell: bash
      run: |
        VERSION=$(python -c "from seewo_guard.config import VERSION; print(VERSION)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build (PyInstaller)
      if: ${{ inputs.mode == 'pyinstaller' || inputs.mode == 'both' }}
      shell: cmd
      env:
        SEEWO_OUTPUT: ${{ inputs.mode == 'both' && 'SeewoGuard-PyInstaller' || 'SeewoGuard' }}
      run: python build.py pyinstaller

    - name: Build (Nuitka)
      if: ${{ inputs.mode == 'nuitka' || inputs.mode == 'both' }}
      shell: cmd
      env:
        SEEWO_OUTPUT: ${{ inputs.mode == 'both' && 'SeewoGuard-Nuitka' || 'SeewoGuard' }}
      run: python build.py nuitka

    - name: Create Official Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || format('v{0}', steps.ver.outputs.version) }}
        name: Release ${{ inputs.tag || format('v{0}', steps.ver.outputs.version) }}
        body: |
          正式发布 v${{ steps.ver.outputs.version }}
          构建方式: ${{ inputs.mode }}
        prerelease: false
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
