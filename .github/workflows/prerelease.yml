name: Pre-release Build

on:
  push:
    branches: [ main ]          # 改成你的默认分支
  schedule:
    # GitHub cron 用 UTC；'0 0 * * 0' = 每周日 00:00 UTC
    # 北京时间周日 08:00 / 美西周六 17:00；想美西周日 00:00 跑就改成 '0 7 * * 0'
    - cron: '0 0 * * 0'
  workflow_dispatch:            # 也允许手动点一下测试

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'   # 建议和你本地一致

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller nuitka
        pip install -r requirements.txt
        pip show pywin32 >nul && python -m pywin32_postinstall -install || echo skip pywin32

    - name: Get version
      id: ver
      shell: bash
      run: |
        VERSION=$(python -c "from seewo_guard.config import VERSION; print(VERSION)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # 打 PyInstaller 包；若只想用 Nuitka，删掉这一步即可
    - name: Build (PyInstaller)
      shell: cmd
      env:
        SEEWO_OUTPUT: SeewoGuard-PyInstaller
      run: python build.py pyinstaller

    # 打 Nuitka 包
    - name: Build (Nuitka)
      shell: cmd
      env:
        SEEWO_OUTPUT: SeewoGuard-Nuitka
      run: python build.py nuitka

    - name: Create Pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.version }}-pre.${{ github.run_number }}
        name: Pre-release v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
        body: |
          自动预发布（push 或每周日定时构建）。
          包含 PyInstaller 与 Nuitka 两种产物（如只需一种，删除对应 Build 步骤）。
          仅供测试，勿用于生产。
        prerelease: true
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
